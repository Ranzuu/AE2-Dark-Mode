name: Bug report
description: Report a missing or wrong texture, or any other problem
title: "[Bug]: "
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AE2 Dark Mode! Please fill in the fields below.
        A screenshot is the most helpful thing you can give us.
        Note: this pack only changes blocks, not GUIs.

  - type: dropdown
    id: bug-type
    attributes:
      label: What kind of bug is it?
      options:
        - Missing texture
        - Wrong texture
        - Wrong colors
        - Animation or glow problem
        - Other
    validations:
      required: true

  - type: input
    id: affected-item
    attributes:
      label: Which block is affected?
      description: The name of the block, and the mod it comes from if you know.
      placeholder: "e.g. ME Controller (Applied Energistics 2)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What did you expect to see, and what do you see instead?
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag and drop an image into this box.
    validations:
      required: false

  - type: input
    id: pack-version
    attributes:
      label: AE2 Dark Mode version
      placeholder: "e.g. v1.21"
    validations:
      required: true

  - type: input
    id: gtnh-version
    attributes:
      label: GTNH version
      placeholder: "e.g. 2.8.4"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Other resource packs in use (they can override this one), shaders, and so on.
    validations:
      required: false
